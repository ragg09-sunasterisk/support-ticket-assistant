# Part 7: receives Claude Code's OTLP metrics and exposes them for Prometheus to scrape on :8889.
# Metrics only: Claude Code's log events (prompts, tool details) are not exported by the lab runs.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # No send_timestamps (the guide sets it): with the run's own timestamps, a finished session fell out of
    # Prometheus instant queries 5 minutes after its last export. Scrape time keeps it visible while exposed.
    metric_expiration: 180m
    # Resource attributes (e.g. OTEL_RESOURCE_ATTRIBUTES=arm=after,task=...) become labels.
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
