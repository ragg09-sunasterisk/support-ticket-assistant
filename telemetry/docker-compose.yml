# Part 7: Claude Code telemetry, after anthropics/claude-code-monitoring-guide.
# OpenTelemetry Collector (OTLP in) -> Prometheus (stores the metrics) -> Grafana (dashboard).
# Images are pinned. Ports listen on 127.0.0.1 only. Start/stop: npm run telemetry:up / telemetry:down.
name: sta-telemetry

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC (Claude Code sends here)
      - "127.0.0.1:4318:4318" # OTLP HTTP
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=200h
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on: [otel-collector]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      # Local, read-only dashboard: anonymous viewers, no login form, no admin password to manage.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      # 3000 is a common dev-server port. If it is taken: GRAFANA_PORT=3300 npm run telemetry:up
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
